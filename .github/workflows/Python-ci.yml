name: Python CI

on:
  push:
    branches: [main, bug-and-failure-fix]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: pip install ruff

      - name: Prepare formatting patch for review
        run: |
          ruff check . --fix --extend-unfixable F401,F811 --exit-zero
          ruff format .
          git diff --binary > "$RUNNER_TEMP/ruff.patch"
          git restore --worktree .
      - uses: actions/upload-artifact@v4
        with:
          name: ruff-patch
          path: ${{ runner.temp }}/ruff.patch

      - name: Lint
        run: ruff check . --output-format=github

      - name: Check formatting
        run: ruff format --check .

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    continue-on-error: true   # remove when code passes mypy
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install mypy

      - name: Run mypy
        run: mypy . --ignore-missing-imports

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e "./ored/model[dev,corpus]"
          pip install pytest pytest-cov

      - name: Check syntax
        run: python -m compileall -q -x '(\.venv|venv|\.git|node_modules)' .

      - name: Run tests with coverage
        run: |
          pytest ored/model/tests --cov=ored --cov-report=term-missing
