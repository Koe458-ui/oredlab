<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Chat · Ored AI</title>
  <meta name="description" content="Ored is an AI model built from scratch that runs locally on your PC. No cloud, no accounts." />
  <meta name="theme-color" content="#f7f9fc" />
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml" />

  <script>
    try {
      const saved = localStorage.getItem('ored-theme');
      const dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    } catch (e) {}
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="header">
    <a class="header__logo" href="index.html" aria-label="Ored home">
      <svg class="logo-mark" viewBox="0 0 32 32" aria-hidden="true">
        <circle cx="16" cy="16" r="12" fill="none" stroke="currentColor" stroke-width="3.5" />
      </svg>
      <span>Ored</span>
    </a>

    <nav class="header__nav" aria-label="Main">
      <a href="chat.html" aria-current="page">Chat</a>
      <a href="download.html">Download</a>
      <a href="pricing.html">Pricing</a>
      <a href="policy.html">Policy</a>
    </nav>

    <div class="header__actions">
      <button id="theme-toggle" class="icon-btn" type="button" aria-label="Switch to dark theme">
        <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="4" />
          <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
        </svg>
        <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" />
        </svg>
      </button>
      <a class="btn btn--outline btn--sm" href="#login">Login</a>
    </div>
  </header>

  <main class="subpage">
    <h1>Chat</h1>
    <p class="lead">Coming soon.</p>
  </main>

  <footer class="footer">
    <div id="about">
      <h3>About</h3>
      <p>Oredlab is an independent AI model, built in the open and free to run locally.</p>
    </div>
    <div id="contact">
      <h3>Contact</h3>
      <p><a href="https://github.com/Koe458-ui/oredlab">GitHub</a> · <a href="https://github.com/Koe458-ui/oredlab/issues">Open an issue</a></p>
    </div>
    <p class="footer__copy">© <span id="year"></span> Oredlab</p>
  </footer>

  <script type="module" src="js/site.js"></script>
</body>
</html>
